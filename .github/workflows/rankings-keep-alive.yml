name: rankings-keep-alive

# Daily: touch the API and the database so the free Supabase project never pauses
# (free projects pause after 7 days without activity).
on:
  schedule:
    - cron: "41 6 * * *" # daily 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query through the API
        run: >
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors
          "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/app_info?select=key&limit=1"
          -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Query the database
        run: psql "$SUPABASE_DB_URL" -Atc "select now()"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
